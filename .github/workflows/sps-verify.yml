name: Verify SPS

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: SPS Core compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external/sps-core
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install Core dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce SPS production dependency security policy
        working-directory: ${{ github.workspace }}/sps-server/desktop
        run: npm run audit:release

      - name: Enforce SPS development dependency security policy
        working-directory: ${{ github.workspace }}/sps-server/desktop
        run: |
          npm run audit:development
          npm run docs:security:check

      - name: Verify patched Storybook docgen glob compatibility
        run: node --test scripts/storybook-glob-compat.test.mjs

      - name: Typecheck SPS Core server
        run: pnpm --filter @paperclipai/server run typecheck

      - name: Enforce SPS compatibility namespace
        run: |
          pnpm check:sps-compat-boundary
          pnpm test:sps-compat-boundary

      - name: Test SPS-branded first-admin setup
        run: pnpm --filter @paperclipai/ui exec vitest run src/App.test.tsx

      - name: Test SPS public Hub authentication configuration
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/private-hostname-guard.test.ts src/__tests__/sps-google-auth-config.test.ts

      - name: Verify SPS public Hub execution boundary
        working-directory: ${{ github.workspace }}
        run: node sps-server/deploy/hub/test-public-hub-image-boundary.mjs

      - name: Verify SPS public Hub proxy boundary
        working-directory: ${{ github.workspace }}
        run: node sps-server/deploy/hub/test-public-hub-proxy-boundary.mjs

      - name: Verify SPS Cloudflare Tunnel Hub boundary
        working-directory: ${{ github.workspace }}
        run: node sps-server/deploy/hub/test-cloudflare-tunnel-hub-boundary.mjs

      - name: Test SPS Node ownership and signed command authority
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/sps-nodes-routes.test.ts src/services/sps-node-execution.test.ts src/services/heartbeat-sps-node-policy.test.ts --pool=forks --isolate

      - name: Build the SPS browser UI
        run: pnpm --filter @paperclipai/ui run build

      - name: Enforce SPS browser entry bundle budget
        run: |
          pnpm check:sps-ui-bundle
          pnpm test:sps-ui-bundle

  core-full-regression:
    name: SPS Core Linux tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: general
            group: general-server
            shard_index: 0
            shard_count: 3
            label: server 1/3
          - mode: general
            group: general-server
            shard_index: 1
            shard_count: 3
            label: server 2/3
          - mode: general
            group: general-server
            shard_index: 2
            shard_count: 3
            label: server 3/3
          - mode: general
            group: general-workspaces-a
            label: workspaces A
          - mode: general
            group: general-workspaces-b
            label: workspaces B
          - mode: serialized
            shard_index: 0
            shard_count: 4
            label: serialized 1/4
          - mode: serialized
            shard_index: 1
            shard_count: 4
            label: serialized 2/4
          - mode: serialized
            shard_index: 2
            shard_count: 4
            label: serialized 3/4
          - mode: serialized
            shard_index: 3
            shard_count: 4
            label: serialized 4/4
    defaults:
      run:
        working-directory: external/sps-core
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install Core dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bounded Core test shard
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = "serialized" ]; then
            pnpm test:run:serialized -- \
              --shard-index "${{ matrix.shard_index }}" \
              --shard-count "${{ matrix.shard_count }}"
          elif [ "${{ matrix.group }}" = "general-server" ]; then
            pnpm test:run:general -- \
              --group "${{ matrix.group }}" \
              --shard-index "${{ matrix.shard_index }}" \
              --shard-count "${{ matrix.shard_count }}"
          else
            pnpm test:run:general -- --group "${{ matrix.group }}"
          fi

  core-full-build:
    name: SPS Core full Linux typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: external/sps-core
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install Core dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck every Core workspace
        run: pnpm typecheck

      - name: Build every Core workspace
        run: pnpm build

      - name: Require clean Linux catalog build
        run: git diff --exit-code -- packages/skills-catalog/generated/catalog.json packages/teams-catalog/generated/catalog.json

      - name: Install Desktop transport dependencies without Electron startup
        working-directory: sps-server/desktop
        run: npm ci --ignore-scripts

      - name: Verify Native Desktop client against the real isolated Core
        timeout-minutes: 5
        run: pnpm --filter @paperclipai/db exec tsx ../../../../sps-server/desktop/scripts/smoke-native-enrollment-client-core.mjs --isolated-native-enrollment-client

      - name: Verify Main enrollment and restart recovery against the real isolated Core
        timeout-minutes: 5
        run: pnpm --filter @paperclipai/db exec tsx ../../../../sps-server/desktop/scripts/smoke-native-enrollment-client-core.mjs --isolated-native-member-controller

      - name: Verify Main TLS and parent IPC enrollment against the real isolated Core child
        timeout-minutes: 5
        run: pnpm --filter @paperclipai/db exec tsx ../../../../sps-server/desktop/scripts/smoke-native-enrollment-client-core.mjs --isolated-native-parent-ingress

      - name: Verify Native Workspace proof signer against the real Core verifier
        timeout-minutes: 3
        run: pnpm --filter @paperclipai/db exec tsx ../../../../sps-server/desktop/scripts/smoke-native-workspace-proof.mjs --isolated-native-workspace-proof

      - name: Verify Native Workspace TLS and owned Core channel with actual authorization
        timeout-minutes: 5
        run: pnpm --filter @paperclipai/db exec tsx ../../../../sps-server/desktop/scripts/smoke-native-workspace-channel.mjs --isolated-native-workspace-channel

      - name: Verify signed Native Node execution and revocation
        timeout-minutes: 5
        run: pnpm --filter @paperclipai/db exec tsx ../../../../sps-server/desktop/scripts/smoke-native-workspace-channel.mjs --isolated-native-workspace-channel --with-native-node

      - name: Verify Native Plugin execution without Agents
        timeout-minutes: 5
        run: pnpm --filter @paperclipai/db exec tsx ../../../../sps-server/desktop/scripts/smoke-native-workspace-channel.mjs --isolated-native-workspace-channel --with-native-plugin-node

      - name: Verify signed Native Source routes and scoped lease revocation
        timeout-minutes: 5
        run: pnpm --filter @paperclipai/db exec tsx ../../../../sps-server/desktop/scripts/smoke-native-workspace-channel.mjs --isolated-native-workspace-channel --with-native-plugin-source

  room-plugin:
    name: SPS Room workplane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sps-server/sps-room-chat/package-lock.json

      - name: Install pinned pnpm for the SPS plugin SDK
        run: npm install --global pnpm@11.9.0

      - name: Build SPS plugin SDK for the Room workplane
        working-directory: external/sps-core
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @paperclipai/plugin-sdk run build

      - name: Install SPS Room plugin dependencies
        working-directory: sps-server/sps-room-chat
        run: npm ci

      - name: Verify SPS Room durable workplane
        working-directory: sps-server/sps-room-chat
        run: npm run check

  bundled-plugins:
    name: SPS bundled plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sps-server/sps-plugin-discovery/package-lock.json

      - name: Install public SDK build tools
        working-directory: external/sps-plugin-sdk
        run: npm ci

      - name: Verify SPS Default Memory
        working-directory: sps-server/sps-default-memory
        run: npm run check

      - name: Install SPS Plugin Discovery dependencies
        working-directory: sps-server/sps-plugin-discovery
        run: npm ci

      - name: Rebuild and verify SPS Plugin Discovery
        working-directory: sps-server/sps-plugin-discovery
        run: npm run check

  identity:
    name: SPS Identity contracts (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sps-server/sps-identity/package-lock.json

      - name: Install SPS Identity dependencies
        working-directory: sps-server/sps-identity
        run: npm ci

      - name: Verify sign-in, token rotation, revocation, and concurrency
        working-directory: sps-server/sps-identity
        run: npm test

  plugin-kit:
    name: SPS Plugin Kit and Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: external/sps-plugin-sdk/package-lock.json

      - name: Install SPS Plugin Kit dependencies
        working-directory: external/sps-plugin-sdk
        run: npm ci

      - name: Verify SPS Plugin Kit, Registry, and publication templates
        working-directory: external/sps-plugin-sdk
        run: npm test

  desktop:
    name: SPS Desktop and Node
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sps-server/desktop/package-lock.json
            external/sps-plugin-sdk/package-lock.json
            sps-server/sps-plugin-discovery/package-lock.json
            sps-server/sps-room-chat/package-lock.json

      - name: Install pinned pnpm for SPS Core runtime packaging
        run: npm install --global pnpm@11.9.0

      - name: Install SPS Core dependencies for Desktop runtime packaging
        working-directory: external/sps-core
        run: pnpm install --frozen-lockfile

      - name: Build SPS Core package prerequisites for Desktop E2E
        working-directory: external/sps-core
        run: |
          pnpm --filter @paperclipai/plugin-sdk run build
          pnpm --filter "@paperclipai/adapter-*" run build
          pnpm --filter @paperclipai/hermes-paperclip-adapter run build
          pnpm --filter paperclipai run build

      - name: Install SPS Desktop dependencies
        working-directory: sps-server/desktop
        run: npm ci

      - name: Verify OpenSSL fixture prerequisite
        working-directory: sps-server/desktop
        run: |
          node --input-type=module -e "import { resolveOpenSsl } from './test/helpers/native-tls-fixtures.mjs'; await resolveOpenSsl({ onProbe: (probe) => console.log(JSON.stringify({ fixtureOpenSslProbe: probe })) });"

      - name: Test SPS Desktop invite and update flow
        working-directory: sps-server/desktop
        run: npm run test:ci

      - name: Run isolated Desktop bootstrap E2E
        working-directory: sps-server/desktop
        run: npm run test:e2e:bootstrap

      - name: Verify isolated Native identity secure storage across Electron processes
        timeout-minutes: 3
        working-directory: sps-server/desktop
        run: npm run test:e2e:native-identity-storage

      - name: Run independent Native Core Settings source E2E
        timeout-minutes: 5
        working-directory: sps-server/desktop
        run: npm run test:e2e:core-settings

      - name: Install SPS Plugin Discovery dependencies for Desktop runtime packaging
        working-directory: sps-server/sps-plugin-discovery
        run: npm ci

      - name: Install SPS Room Chat dependencies for Desktop runtime packaging
        working-directory: sps-server/sps-room-chat
        run: npm ci

      - name: Install public Plugin SDK build tools for Desktop runtime packaging
        working-directory: external/sps-plugin-sdk
        run: npm ci

      - name: Prepare Owner Host runtime for Desktop E2E
        working-directory: sps-server/desktop
        run: npm run prepare:owner-host-runtime

      - name: Run No-AI Workspace source Desktop E2E
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_SOURCE: "1"
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode runtime-discovery

      - name: Require clean Windows catalog build
        run: git -C external/sps-core diff --exit-code -- packages/skills-catalog/generated/catalog.json packages/teams-catalog/generated/catalog.json

      - name: Run prepared Native Host management source Desktop E2E
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_SOURCE: "1"
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode native-management

      - name: Require clean catalog after Native management E2E
        run: git -C external/sps-core diff --exit-code -- packages/skills-catalog/generated/catalog.json packages/teams-catalog/generated/catalog.json

      - name: Verify Native public SDK connectivity with enrolled Member TLS and Electron
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode native-plugin-sdk

      - name: Verify Workspace execution control across Desktop restart
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_SOURCE: "1"
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode execution-control

      - name: Verify Owner Vault transfer through source Desktop Main
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_SOURCE: "1"
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode owner-vault-transfer

      - name: Verify Owner Vault crash recovery through source Desktop Main
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_SOURCE: "1"
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode owner-vault-crash-recovery

      - name: Verify legacy Desktop state migration through source Main
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_SOURCE: "1"
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode owner-vault-state-migration

      - name: Verify pinned historical Core schema upgrade and backup recovery
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode historical-core-migration

      - name: Verify historical Core backup through actual Desktop Main restore
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_SOURCE: "1"
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode owner-vault-historical-core

      - name: Build unpacked Windows Desktop for E2E
        working-directory: sps-server/desktop
        run: npx electron-builder --win dir --publish never

      - name: Verify packaged Owner Host runtime and Windows Job supervisor
        working-directory: sps-server/desktop
        run: npm run verify:packaged-owner-host-runtime

      - name: Add E2E update provider configuration
        working-directory: sps-server/desktop
        shell: pwsh
        run: |
          @"
          owner: Powerpunch777
          repo: SPS-Desktop-Releases
          provider: github
          releaseType: release
          channel: latest
          updaterCacheDirName: '@spsdesktop-updater'
          "@ | Set-Content -LiteralPath 'dist/win-unpacked/resources/app-update.yml' -Encoding utf8NoBOM

      - name: Verify packaged Workspace execution control across Desktop restart
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_BINARY: ${{ github.workspace }}\sps-server\desktop\dist\win-unpacked\SPS Desktop.exe
          SPS_DESKTOP_E2E_SOURCE: "0"
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode execution-control

      - name: Run packaged Desktop workspace surfaces E2E
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_BINARY: ${{ github.workspace }}\sps-server\desktop\dist\win-unpacked\SPS Desktop.exe
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode workspace-surfaces

      - name: Run packaged Desktop plugin preview E2E
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_BINARY: ${{ github.workspace }}\sps-server\desktop\dist\win-unpacked\SPS Desktop.exe
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode plugin-preview

      - name: Run packaged Desktop Host plugin lifecycle E2E
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_BINARY: ${{ github.workspace }}\sps-server\desktop\dist\win-unpacked\SPS Desktop.exe
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode host-plugin-lifecycle

      - name: Build unsigned Windows installer for data preservation E2E
        working-directory: sps-server/desktop
        run: npx --no-install electron-builder --prepackaged dist/win-unpacked --win nsis --publish never

      - name: Verify installed Windows package and retained user data
        timeout-minutes: 20
        shell: powershell
        working-directory: sps-server/desktop
        run: .\scripts\run-windows-ci-e2e.ps1 -Mode installer-data-preservation

      - name: Test SPS node signing, command lease, and capability flow
        working-directory: sps-server/desktop-node
        run: npm test
