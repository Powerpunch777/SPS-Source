name: Verify SPS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: SPS Core compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external/sps-core
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.4

      - name: Install Core dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck SPS Core server
        run: pnpm --filter @paperclipai/server run typecheck

      - name: Test SPS-branded first-admin setup
        run: pnpm --filter @paperclipai/ui exec vitest run src/App.test.tsx

      - name: Test SPS public Hub authentication configuration
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/private-hostname-guard.test.ts src/__tests__/sps-google-auth-config.test.ts

      - name: Test SPS Node ownership and signed command authority
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/sps-nodes-routes.test.ts src/services/sps-node-execution.test.ts --pool=forks --isolate

      - name: Build the SPS browser UI
        run: pnpm --filter @paperclipai/ui run build

  room-plugin:
    name: SPS Room workplane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sps-server/sps-room-chat/package-lock.json

      - name: Install pinned pnpm for the SPS plugin SDK
        run: npm install --global pnpm@9.15.4

      - name: Build SPS plugin SDK for the Room workplane
        working-directory: external/sps-core
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @paperclipai/plugin-sdk run build

      - name: Install SPS Room plugin dependencies
        working-directory: sps-server/sps-room-chat
        run: npm ci

      - name: Verify SPS Room durable workplane
        working-directory: sps-server/sps-room-chat
        run: npm run check

  desktop:
    name: SPS Desktop and Node
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sps-server/desktop/package-lock.json

      - name: Install SPS Desktop dependencies
        working-directory: sps-server/desktop
        run: npm ci

      - name: Test SPS Desktop invite and update flow
        working-directory: sps-server/desktop
        run: npm test

      - name: Test SPS node signing, command lease, and capability flow
        working-directory: sps-server/desktop-node
        run: npm test
