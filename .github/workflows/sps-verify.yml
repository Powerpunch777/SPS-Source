name: Verify SPS

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: SPS Core compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external/sps-core
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install Core dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce SPS production dependency security policy
        working-directory: ${{ github.workspace }}/sps-server/desktop
        run: npm run audit:release

      - name: Typecheck SPS Core server
        run: pnpm --filter @paperclipai/server run typecheck

      - name: Test SPS-branded first-admin setup
        run: pnpm --filter @paperclipai/ui exec vitest run src/App.test.tsx

      - name: Test SPS public Hub authentication configuration
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/private-hostname-guard.test.ts src/__tests__/sps-google-auth-config.test.ts

      - name: Verify SPS public Hub execution boundary
        working-directory: ${{ github.workspace }}
        run: node sps-server/deploy/hub/test-public-hub-image-boundary.mjs

      - name: Verify SPS public Hub proxy boundary
        working-directory: ${{ github.workspace }}
        run: node sps-server/deploy/hub/test-public-hub-proxy-boundary.mjs

      - name: Verify SPS Cloudflare Tunnel Hub boundary
        working-directory: ${{ github.workspace }}
        run: node sps-server/deploy/hub/test-cloudflare-tunnel-hub-boundary.mjs

      - name: Test SPS Node ownership and signed command authority
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/sps-nodes-routes.test.ts src/services/sps-node-execution.test.ts src/services/heartbeat-sps-node-policy.test.ts --pool=forks --isolate

      - name: Build the SPS browser UI
        run: pnpm --filter @paperclipai/ui run build

  room-plugin:
    name: SPS Room workplane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sps-server/sps-room-chat/package-lock.json

      - name: Install pinned pnpm for the SPS plugin SDK
        run: npm install --global pnpm@11.9.0

      - name: Build SPS plugin SDK for the Room workplane
        working-directory: external/sps-core
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @paperclipai/plugin-sdk run build

      - name: Install SPS Room plugin dependencies
        working-directory: sps-server/sps-room-chat
        run: npm ci

      - name: Verify SPS Room durable workplane
        working-directory: sps-server/sps-room-chat
        run: npm run check

  bundled-plugins:
    name: SPS bundled plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sps-server/sps-plugin-discovery/package-lock.json

      - name: Verify SPS Default Memory
        working-directory: sps-server/sps-default-memory
        run: npm run check

      - name: Install SPS Plugin Discovery dependencies
        working-directory: sps-server/sps-plugin-discovery
        run: npm ci

      - name: Rebuild and verify SPS Plugin Discovery
        working-directory: sps-server/sps-plugin-discovery
        run: npm run check

  plugin-kit:
    name: SPS Plugin Kit and Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: external/sps-plugin-sdk/package-lock.json

      - name: Install SPS Plugin Kit dependencies
        working-directory: external/sps-plugin-sdk
        run: npm ci

      - name: Verify SPS Plugin Kit, Registry, and publication templates
        working-directory: external/sps-plugin-sdk
        run: npm test

  desktop:
    name: SPS Desktop and Node
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sps-server/desktop/package-lock.json
            external/sps-plugin-sdk/package-lock.json

      - name: Install pinned pnpm for SPS Core runtime packaging
        run: npm install --global pnpm@11.9.0

      - name: Install SPS Core dependencies for Desktop runtime packaging
        working-directory: external/sps-core
        run: pnpm install --frozen-lockfile

      - name: Build SPS Core package prerequisites for Desktop E2E
        working-directory: external/sps-core
        run: |
          pnpm --filter @paperclipai/plugin-sdk run build
          pnpm --filter "@paperclipai/adapter-*" run build
          pnpm --filter @paperclipai/hermes-paperclip-adapter run build
          pnpm --filter paperclipai run build

      - name: Install SPS Desktop dependencies
        working-directory: sps-server/desktop
        run: npm ci

      - name: Test SPS Desktop invite and update flow
        working-directory: sps-server/desktop
        run: npm test

      - name: Run isolated Desktop bootstrap E2E
        working-directory: sps-server/desktop
        run: npm run test:e2e:bootstrap

      - name: Prepare Owner Host runtime for Desktop E2E
        working-directory: sps-server/desktop
        run: npm run prepare:owner-host-runtime

      - name: Build unpacked Windows Desktop for E2E
        working-directory: sps-server/desktop
        run: npx electron-builder --win dir --publish never

      - name: Add E2E update provider configuration
        working-directory: sps-server/desktop
        shell: pwsh
        run: |
          @"
          owner: Powerpunch777
          repo: SPS-Desktop-Releases
          provider: github
          releaseType: release
          channel: latest
          updaterCacheDirName: '@spsdesktop-updater'
          "@ | Set-Content -LiteralPath 'dist/win-unpacked/resources/app-update.yml' -Encoding utf8NoBOM

      - name: Run packaged Desktop workspace surfaces E2E
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_BINARY: ${{ github.workspace }}\sps-server\desktop\dist\win-unpacked\SPS Desktop.exe
          SPS_DESKTOP_E2E_HOST_READY_TIMEOUT_MS: "360000"
        run: npm run test:e2e:workspace-surfaces

      - name: Run packaged Desktop plugin preview E2E
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_BINARY: ${{ github.workspace }}\sps-server\desktop\dist\win-unpacked\SPS Desktop.exe
        run: npm run test:e2e:plugin-preview

      - name: Run packaged Desktop Host plugin lifecycle E2E
        working-directory: sps-server/desktop
        env:
          SPS_DESKTOP_E2E_BINARY: ${{ github.workspace }}\sps-server\desktop\dist\win-unpacked\SPS Desktop.exe
        run: npm run test:e2e:host-plugin-lifecycle

      - name: Test SPS node signing, command lease, and capability flow
        working-directory: sps-server/desktop-node
        run: npm test
