name: Build SPS Desktop Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish-beta:
    name: Package unsigned Windows candidate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sps-server/desktop/package-lock.json
            external/sps-plugin-sdk/package-lock.json

      - name: Install pinned pnpm for SPS Core
        run: npm install --global pnpm@9.15.4

      - name: Install SPS Core dependencies
        working-directory: external/sps-core
        run: pnpm install --frozen-lockfile

      - name: Build the SPS Plugin SDK for the Owner Host
        working-directory: external/sps-core
        run: pnpm --filter @paperclipai/plugin-sdk run build

      - name: Build SPS agent adapters for the Owner Host
        working-directory: external/sps-core
        run: |
          pnpm --filter "@paperclipai/adapter-*" run build
          pnpm --filter @paperclipai/hermes-paperclip-adapter run build

      - name: Build the SPS Owner Host CLI
        working-directory: external/sps-core
        run: pnpm --filter paperclipai run build

      - name: Install Desktop dependencies
        working-directory: sps-server/desktop
        run: npm ci

      - name: Run Desktop tests
        working-directory: sps-server/desktop
        run: npm test -- --test-concurrency=1

      - name: Build unsigned candidate without publishing
        working-directory: sps-server/desktop
        run: npm run package:candidate:win

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sps-desktop-candidate-${{ github.sha }}
          path: |
            sps-server/desktop/dist/SPS-Desktop-Setup-*.exe
            sps-server/desktop/dist/SPS-Desktop-Setup-*.exe.blockmap
            sps-server/desktop/dist/latest.yml
            sps-server/desktop/dist/sps-release-manifest.json
            sps-server/desktop/dist/SPS-Agent-Runtime-Pack-*.zip
            sps-server/desktop/dist/sps-agent-runtime-packs.json
          if-no-files-found: error
          retention-days: 14
