name: Release SPS Desktop Beta

on:
  push:
    tags:
      - "desktop-beta-v*"

permissions:
  contents: read

jobs:
  build-and-publish-beta:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.SPS_DESKTOP_RELEASES_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || secrets.SPS_DESKTOP_RELEASES_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sps-server/desktop/package-lock.json
            sps-server/plugin-platform/package-lock.json

      - name: Install pinned pnpm for SPS Core
        run: npm install --global pnpm@9.15.4

      - name: Install SPS Core dependencies
        working-directory: external/sps-core
        run: pnpm install --frozen-lockfile

      - name: Build the SPS Plugin SDK for the Owner Host
        working-directory: external/sps-core
        run: pnpm --filter @paperclipai/plugin-sdk run build

      - name: Build the SPS Owner Host CLI
        working-directory: external/sps-core
        run: pnpm --filter paperclipai run build

      - name: Verify Beta release tag and publishing credentials
        shell: pwsh
        working-directory: sps-server/desktop
        run: |
          $manifest = Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json
          $expectedTag = "desktop-beta-v$($manifest.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Beta release tag must be $expectedTag, but was $env:GITHUB_REF_NAME."
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "SPS_DESKTOP_RELEASES_TOKEN is required to publish the SPS Desktop Beta release."
          }

      - name: Install Desktop dependencies
        working-directory: sps-server/desktop
        run: npm ci

      # The Desktop imports the local plugin platform through an npm file link.
      # npm ci creates that link but does not install the linked package's own
      # dependencies on a clean runner.
      - name: Install Plugin Platform dependencies
        working-directory: sps-server/plugin-platform
        run: npm ci

      - name: Run Desktop tests
        working-directory: sps-server/desktop
        run: npm test -- --test-concurrency=1

      - name: Build and publish unsigned Beta release
        working-directory: sps-server/desktop
        run: npm run release:beta:win
