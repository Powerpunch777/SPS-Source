name: Publish SPS Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prepared tag, including an immutable publication awaiting verification resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sps-stable-publish
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: windows-latest
    environment: sps-production
    env:
      GH_TOKEN: ${{ secrets.SPS_DESKTOP_RELEASES_TOKEN }}
      SOURCE_GITHUB_TOKEN: ${{ github.token }}
      SPS_IDENTITY_RELEASE_ATTESTATION_JSON: ${{ secrets.SPS_IDENTITY_RELEASE_ATTESTATION_JSON }}
      SPS_PHYSICAL_RELEASE_EVIDENCE_JSON: ${{ secrets.SPS_PHYSICAL_RELEASE_EVIDENCE_JSON }}
      SPS_PHYSICAL_RELEASE_DEVICE_KEYS_JSON: ${{ secrets.SPS_PHYSICAL_RELEASE_DEVICE_KEYS_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SPS_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SPS_CLOUDFLARE_ACCOUNT_ID }}
      SPS_IDENTITY_EXPECTED_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.SPS_IDENTITY_EXPECTED_PRODUCTION_DEPLOYMENT_ID }}
      SPS_IDENTITY_EXPECTED_PRODUCTION_VERSION_ID: ${{ secrets.SPS_IDENTITY_EXPECTED_PRODUCTION_VERSION_ID }}
      SPS_IDENTITY_EXPECTED_STAGING_DEPLOYMENT_ID: ${{ secrets.SPS_IDENTITY_EXPECTED_STAGING_DEPLOYMENT_ID }}
      SPS_IDENTITY_EXPECTED_STAGING_VERSION_ID: ${{ secrets.SPS_IDENTITY_EXPECTED_STAGING_VERSION_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sps-server/sps-identity/package-lock.json

      - name: Require exact release inputs and protected secrets
        shell: pwsh
        run: |
          if ($env:SPS_IDENTITY_RELEASE_ATTESTATION_JSON.Length -eq 0) { throw "Identity attestation secret is required." }
          if ($env:SPS_PHYSICAL_RELEASE_EVIDENCE_JSON.Length -eq 0) { throw "Physical evidence secret is required." }
          if ($env:SPS_PHYSICAL_RELEASE_DEVICE_KEYS_JSON.Length -eq 0) { throw "Protected Host and Member device enrollment is required." }
          if ($env:CLOUDFLARE_API_TOKEN.Length -eq 0 -or $env:CLOUDFLARE_ACCOUNT_ID.Length -eq 0) { throw "Cloudflare verification credentials are required." }
          if ($env:SPS_IDENTITY_EXPECTED_PRODUCTION_DEPLOYMENT_ID.Length -eq 0 -or $env:SPS_IDENTITY_EXPECTED_PRODUCTION_VERSION_ID.Length -eq 0 -or $env:SPS_IDENTITY_EXPECTED_STAGING_DEPLOYMENT_ID.Length -eq 0 -or $env:SPS_IDENTITY_EXPECTED_STAGING_VERSION_ID.Length -eq 0) { throw "Exact Identity deployment/version IDs are required." }
          $immutable = gh api -H "X-GitHub-Api-Version: 2026-03-10" repos/Powerpunch777/SPS-Desktop-Releases/immutable-releases | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $immutable.enabled -ne $true) { throw "SPS-Desktop-Releases must enforce GitHub immutable releases before Stable publication." }
          if ("${{ inputs.tag }}" -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "The publish tag is invalid." }
          if ($env:GITHUB_REF_TYPE -eq "branch") { Write-Output "workflow_dispatch uses an explicit tag checkout below." }
          $tagCommit = (git rev-list -n 1 "${{ inputs.tag }}").Trim()
          if ($tagCommit -ne (git rev-parse HEAD).Trim()) { throw "The checked-out Source revision does not match the release tag." }
          git fetch origin main
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tags must already belong to origin/main." }
          if ((git -C external/sps-core rev-parse --is-shallow-repository).Trim() -eq "true") { git -C external/sps-core fetch --unshallow origin main } else { git -C external/sps-core fetch origin main }
          git -C external/sps-core merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "The pinned SPS Core revision must be reachable from its main branch." }
          if ((git -C external/sps-plugin-sdk rev-parse --is-shallow-repository).Trim() -eq "true") { git -C external/sps-plugin-sdk fetch --unshallow origin main } else { git -C external/sps-plugin-sdk fetch origin main }
          git -C external/sps-plugin-sdk merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "The pinned Plugin SDK revision must be reachable from its main branch." }
          $headers = @{ Authorization = "Bearer $env:SOURCE_GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $tagRef = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/${{ inputs.tag }}"
          if ($tagRef.object.type -ne "tag") { throw "Stable releases require a signed annotated Git tag." }
          $tagObject = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/tags/$($tagRef.object.sha)"
          if ($tagObject.verification.verified -ne $true) { throw "GitHub did not verify the release tag signature." }

      - name: Download the exact prepared assets without rebuilding
        shell: pwsh
        run: |
          $releaseApi = "repos/Powerpunch777/SPS-Desktop-Releases/releases/tags/${{ inputs.tag }}"
          $release = gh api $releaseApi | ConvertFrom-Json
          if ($release.tag_name -ne "${{ inputs.tag }}") { throw "The requested prepared release is unavailable." }
          $resumeImmutable = (-not $release.draft -and $release.immutable -eq $true)
          if (-not $release.draft -and -not $resumeImmutable) {
            gh release edit "${{ inputs.tag }}" --repo Powerpunch777/SPS-Desktop-Releases --draft=true --latest=false
            if ($LASTEXITCODE -ne 0) { throw "A published mutable release was detected and could not be quarantined." }
            throw "A published mutable release was quarantined before Stable verification. Prepare a new immutable candidate."
          }
          if (@($release.assets).Count -eq 0 -or @($release.assets | Where-Object { $_.digest -notmatch '^sha256:[0-9a-f]{64}$' }).Count -gt 0) { throw "Every prepared asset must expose a GitHub SHA-256 digest." }
          $before = [ordered]@{
            releaseId = $release.id
            tagName = $release.tag_name
            assets = @($release.assets | Sort-Object name | ForEach-Object { [ordered]@{ id = $_.id; name = $_.name; size = $_.size; digest = $_.digest; updatedAt = $_.updated_at } })
          }
          gh release download "${{ inputs.tag }}" --repo Powerpunch777/SPS-Desktop-Releases --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw "Could not download the prepared release assets." }
          $afterRelease = gh api $releaseApi | ConvertFrom-Json
          $after = [ordered]@{
            releaseId = $afterRelease.id
            tagName = $afterRelease.tag_name
            assets = @($afterRelease.assets | Sort-Object name | ForEach-Object { [ordered]@{ id = $_.id; name = $_.name; size = $_.size; digest = $_.digest; updatedAt = $_.updated_at } })
          }
          if (($before | ConvertTo-Json -Depth 6 -Compress) -ne ($after | ConvertTo-Json -Depth 6 -Compress)) { throw "Prepared release assets changed while they were being downloaded." }
          if ($afterRelease.draft -ne $release.draft -or $afterRelease.immutable -ne $release.immutable) { throw "Release publication state changed while assets were being downloaded." }
          [IO.File]::WriteAllText((Join-Path $PWD "release-asset-snapshot.json"), ($after | ConvertTo-Json -Depth 6 -Compress), [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $PWD "release-publication-state.json"), ([ordered]@{ resumeImmutable = $resumeImmutable } | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))

      - name: Verify the prepared manifest, hashes, and signature
        shell: pwsh
        run: |
          $env:SPS_RELEASE_ASSETS_DIRECTORY = (Resolve-Path "release-assets").Path
          $env:SPS_REQUIRE_EXACT_RELEASE_ASSET_SET = "1"
          $env:SPS_SOURCE_REVISION = (git rev-parse HEAD).Trim()
          node sps-server/desktop/scripts/verify-release-assets.mjs

      - name: Verify physical Host and Member evidence against the exact downloaded installer
        shell: pwsh
        run: |
          $path = Join-Path $PWD "physical-evidence.json"
          [IO.File]::WriteAllText($path, $env:SPS_PHYSICAL_RELEASE_EVIDENCE_JSON, [Text.UTF8Encoding]::new($false))
          $manifest = Get-Content -Raw -Encoding utf8 "release-assets/sps-release-manifest.json" | ConvertFrom-Json
          $installer = Get-Item (Join-Path "release-assets" $manifest.artifacts.installer.file)
          if (-not $installer) { throw "Draft release installer is missing." }
          $env:SPS_PHYSICAL_EVIDENCE_PATH = $path
          $env:SPS_FINAL_INSTALLER_PATH = $installer.FullName
          $env:SPS_RELEASE_CHALLENGE_PATH = (Resolve-Path "release-assets/sps-release-challenge.json").Path
          node sps-server/desktop/scripts/verify-physical-release-evidence.mjs

      - name: Verify production Identity remotely and require full OAuth evidence
        shell: pwsh
        working-directory: sps-server/sps-identity
        run: |
          npm ci
          $attestation = Join-Path $env:RUNNER_TEMP "identity-attestation.json"
          [IO.File]::WriteAllText($attestation, $env:SPS_IDENTITY_RELEASE_ATTESTATION_JSON, [Text.UTF8Encoding]::new($false))
          $env:SPS_IDENTITY_ATTESTATION_PATH = $attestation
          $env:SPS_IDENTITY_EXPECTED_SOURCE_SHA = (git -C ..\.. rev-parse HEAD).Trim()
          node scripts/verify-release-attestation.mjs $attestation

      - name: Publish the same downloaded bytes
        shell: pwsh
        run: |
          $releaseApi = "repos/Powerpunch777/SPS-Desktop-Releases/releases/tags/${{ inputs.tag }}"
          $release = gh api $releaseApi | ConvertFrom-Json
          if (@($release.assets).Count -eq 0 -or @($release.assets | Where-Object { $_.digest -notmatch '^sha256:[0-9a-f]{64}$' }).Count -gt 0) { throw "Every verified asset must retain its GitHub SHA-256 digest." }
          $current = [ordered]@{
            releaseId = $release.id
            tagName = $release.tag_name
            assets = @($release.assets | Sort-Object name | ForEach-Object { [ordered]@{ id = $_.id; name = $_.name; size = $_.size; digest = $_.digest; updatedAt = $_.updated_at } })
          }
          $snapshot = Get-Content -Raw -Encoding utf8 "release-asset-snapshot.json" | ConvertFrom-Json
          if (($snapshot | ConvertTo-Json -Depth 6 -Compress) -ne ($current | ConvertTo-Json -Depth 6 -Compress)) { throw "Release assets changed after verification; refusing publication." }
          if (-not $release.draft -and $release.immutable -ne $true) {
            gh release edit "${{ inputs.tag }}" --repo Powerpunch777/SPS-Desktop-Releases --draft=true --latest=false
            throw "The release became mutable before Stable verification and was quarantined when possible."
          }
          if ($release.draft) {
            $immutable = gh api -H "X-GitHub-Api-Version: 2026-03-10" repos/Powerpunch777/SPS-Desktop-Releases/immutable-releases | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $immutable.enabled -ne $true) { throw "Immutable releases were disabled immediately before publication; the verified draft remains unpublished." }
            gh release edit "${{ inputs.tag }}" --repo Powerpunch777/SPS-Desktop-Releases --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the verified immutable draft." }
          } else {
            Write-Output "Resuming attestation verification for the already-published immutable release."
          }
          $published = gh api $releaseApi | ConvertFrom-Json
          $publishedSnapshot = [ordered]@{
            releaseId = $published.id
            tagName = $published.tag_name
            assets = @($published.assets | Sort-Object name | ForEach-Object { [ordered]@{ id = $_.id; name = $_.name; size = $_.size; digest = $_.digest; updatedAt = $_.updated_at } })
          }
          if ($published.draft -or $published.immutable -ne $true -or ($snapshot | ConvertTo-Json -Depth 6 -Compress) -ne ($publishedSnapshot | ConvertTo-Json -Depth 6 -Compress)) {
            if (-not $published.draft -and $published.immutable -ne $true) {
              gh release edit "${{ inputs.tag }}" --repo Powerpunch777/SPS-Desktop-Releases --draft=true --latest=false
            }
            throw "Published release is not the exact immutable release that was verified before publication."
          }
          gh release verify "${{ inputs.tag }}" --repo Powerpunch777/SPS-Desktop-Releases
          if ($LASTEXITCODE -ne 0) { throw "GitHub could not verify the immutable release attestation." }
          Get-ChildItem -LiteralPath "release-assets" -File | ForEach-Object {
            gh release verify-asset "${{ inputs.tag }}" $_.FullName --repo Powerpunch777/SPS-Desktop-Releases
            if ($LASTEXITCODE -ne 0) { throw "GitHub could not verify immutable release asset $($_.Name)." }
          }
          $verified = gh api $releaseApi | ConvertFrom-Json
          $verifiedSnapshot = [ordered]@{
            releaseId = $verified.id
            tagName = $verified.tag_name
            assets = @($verified.assets | Sort-Object name | ForEach-Object { [ordered]@{ id = $_.id; name = $_.name; size = $_.size; digest = $_.digest; updatedAt = $_.updated_at } })
          }
          if ($verified.immutable -ne $true -or ($snapshot | ConvertTo-Json -Depth 6 -Compress) -ne ($verifiedSnapshot | ConvertTo-Json -Depth 6 -Compress)) { throw "Immutable release identity changed during attestation verification." }
          $latest = gh api repos/Powerpunch777/SPS-Desktop-Releases/releases/latest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -ne "${{ inputs.tag }}" -or $latest.draft -or $latest.immutable -ne $true) {
            throw "GitHub latest does not point to the exact immutable Stable release that was verified."
          }
