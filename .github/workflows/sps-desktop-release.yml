name: Release SPS Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sign-and-publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.SPS_DESKTOP_RELEASES_TOKEN }}
      WIN_CSC_LINK: ${{ secrets.SPS_WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.SPS_WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sps-server/desktop/package-lock.json
            external/sps-plugin-sdk/package-lock.json

      - name: Install pinned pnpm for SPS Core
        run: npm install --global pnpm@11.9.0

      - name: Install SPS Core dependencies
        working-directory: external/sps-core
        run: pnpm install --frozen-lockfile

      - name: Build SPS Core release prerequisites
        working-directory: external/sps-core
        run: |
          pnpm --filter @paperclipai/plugin-sdk run build
          pnpm --filter "@paperclipai/adapter-*" run build
          pnpm --filter @paperclipai/hermes-paperclip-adapter run build
          pnpm --filter paperclipai run build

      - name: Verify release tag and signing credentials
        shell: pwsh
        working-directory: sps-server/desktop
        run: |
          $manifest = Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag must be $expectedTag, but was $env:GITHUB_REF_NAME."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "SPS Windows signing secrets are required. Refusing to publish an unsigned Desktop release."
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "SPS_DESKTOP_RELEASES_TOKEN is required to publish to the separate Desktop release channel."
          }

      - name: Reject an existing immutable Desktop release
        shell: pwsh
        working-directory: sps-server/desktop
        run: |
          $manifest = Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          $releaseRepo = "Powerpunch777/SPS-Desktop-Releases"
          gh release view $tag --repo $releaseRepo *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "SPS Desktop release $tag already exists. Release artifacts are immutable; bump the version."
          }

      - name: Install Desktop dependencies
        working-directory: sps-server/desktop
        run: npm ci

      - name: Enforce SPS production dependency security policy
        working-directory: sps-server/desktop
        run: npm run audit:release

      - name: Run Desktop tests
        working-directory: sps-server/desktop
        run: npm test -- --test-concurrency=1

      - name: Run Desktop Node tests
        working-directory: sps-server/desktop-node
        run: npm test -- --test-concurrency=1

      - name: Build and sign the immutable release candidate
        working-directory: sps-server/desktop
        env:
          SPS_REQUIRE_CLEAN_RELEASE: "1"
          SPS_RELEASE_STATUS: "stable"
        run: npm run release:win

      - name: Verify installer signature and release manifest
        shell: pwsh
        working-directory: sps-server/desktop
        run: |
          $manifest = Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json
          $installer = Join-Path $PWD "dist\SPS-Desktop-Setup-$($manifest.version).exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid") {
            throw "Signed SPS Desktop installer verification failed: $($signature.Status)"
          }
          $releaseManifest = Get-Content -Raw -Encoding utf8 "dist\sps-release-manifest.json" | ConvertFrom-Json
          if ($releaseManifest.baseline.desktopVersion -ne $manifest.version) {
            throw "Release manifest version does not match the Desktop package."
          }

      - name: Publish the verified stable release
        shell: pwsh
        working-directory: sps-server/desktop
        run: |
          $manifest = Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          $releaseRepo = "Powerpunch777/SPS-Desktop-Releases"
          $installer = "dist\SPS-Desktop-Setup-$($manifest.version).exe"
          $blockmap = "$installer.blockmap"
          gh release create $tag --repo $releaseRepo --target main --title "SPS Desktop $($manifest.version)" --draft --notes "Signed Windows stable release. See sps-release-manifest.json for the exact Desktop, Core, Extension Profile, and artifact hashes."
          $runtimePacks = @(Get-ChildItem -LiteralPath "dist" -Filter "SPS-Agent-Runtime-Pack-*.zip" -File | ForEach-Object FullName)
          $releaseAssets = @($installer, $blockmap, "dist\latest.yml", "dist\sps-release-manifest.json", "dist\sps-agent-runtime-packs.json") + $runtimePacks
          gh release upload $tag --repo $releaseRepo @releaseAssets
          gh release edit $tag --repo $releaseRepo --draft=false --prerelease=false --latest
