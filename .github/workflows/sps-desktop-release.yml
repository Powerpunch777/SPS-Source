name: Release SPS Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sign-and-publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.SPS_DESKTOP_RELEASES_TOKEN }}
      WIN_CSC_LINK: ${{ secrets.SPS_WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.SPS_WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sps-server/desktop/package-lock.json

      - name: Verify release tag and signing credentials
        shell: pwsh
        working-directory: sps-server/desktop
        run: |
          $manifest = Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag must be $expectedTag, but was $env:GITHUB_REF_NAME."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "SPS Windows signing secrets are required. Refusing to publish an unsigned Desktop release."
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "SPS_DESKTOP_RELEASES_TOKEN is required to publish to the separate Desktop release channel."
          }

      - name: Prepare Desktop update release
        shell: pwsh
        working-directory: sps-server/desktop
        run: |
          $manifest = Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          $releaseRepo = "Powerpunch777/SPS-Desktop-Releases"
          gh release view $tag --repo $releaseRepo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $releaseRepo --target main --title "SPS Desktop $($manifest.version)" --prerelease --draft
          }

      - name: Install Desktop dependencies
        working-directory: sps-server/desktop
        run: npm ci

      - name: Run Desktop tests
        working-directory: sps-server/desktop
        run: npm test -- --test-concurrency=1

      - name: Build, sign, and publish GitHub Release
        working-directory: sps-server/desktop
        run: npm run release:win
