name: Build SPS Desktop Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/sps-verify.yml
    secrets: inherit

  package-pilot:
    name: Package unsigned Windows pilot installer
    needs: verify
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SPS_SOURCE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sps-server/desktop/package-lock.json
            external/sps-plugin-sdk/package-lock.json
            sps-server/sps-plugin-discovery/package-lock.json
            sps-server/sps-room-chat/package-lock.json

      - name: Install pinned pnpm for SPS Core
        run: npm install --global pnpm@11.9.0

      - name: Install SPS Core dependencies
        working-directory: external/sps-core
        run: pnpm install --frozen-lockfile

      - name: Build SPS Core package prerequisites
        working-directory: external/sps-core
        run: |
          pnpm --filter @paperclipai/plugin-sdk run build
          pnpm --filter "@paperclipai/adapter-*" run build
          pnpm --filter @paperclipai/hermes-paperclip-adapter run build
          pnpm --filter paperclipai run build

      - name: Install Desktop dependencies
        working-directory: sps-server/desktop
        run: npm ci

      - name: Enforce SPS production dependency security policy
        working-directory: sps-server/desktop
        run: npm run audit:release

      - name: Enforce SPS development dependency security policy
        working-directory: sps-server/desktop
        run: |
          npm run audit:development
          npm run docs:security:check

      - name: Verify Desktop tests
        working-directory: sps-server/desktop
        run: npm test -- --test-concurrency=1

      - name: Verify Desktop Node protocol tests
        working-directory: sps-server/desktop-node
        run: npm test -- --test-concurrency=1

      - name: Install public Plugin SDK build tools for Desktop packaging
        working-directory: external/sps-plugin-sdk
        run: npm ci

      - name: Install SPS Plugin Discovery dependencies for Desktop runtime packaging
        working-directory: sps-server/sps-plugin-discovery
        run: npm ci

      - name: Install SPS Room Chat dependencies for Desktop runtime packaging
        working-directory: sps-server/sps-room-chat
        run: npm ci

      - name: Build unsigned pilot installer without publishing
        working-directory: sps-server/desktop
        run: npm run package:candidate:win

      - name: Upload pilot installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sps-desktop-pilot-${{ github.sha }}
          path: |
            sps-server/desktop/dist/SPS-Desktop-Setup-*.exe
            sps-server/desktop/dist/SPS-Desktop-Setup-*.exe.blockmap
            sps-server/desktop/dist/latest.yml
            sps-server/desktop/dist/sps-release-manifest.json
          if-no-files-found: error
          retention-days: 14
