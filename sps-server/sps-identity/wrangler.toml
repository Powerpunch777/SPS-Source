name = "sps-identity"
main = "src/worker.mjs"
compatibility_date = "2026-07-24"
workers_dev = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "sps-identity"
database_id = "9d1caea5-6043-40a7-93dc-273157b2e445"

[vars]
SPS_IDENTITY_ISSUER = "https://auth.redongames.com"
SPS_IDENTITY_AUDIENCE = "sps-core"
SPS_IDENTITY_KEY_ID = "sps-identity-2026-01"
SPS_IDENTITY_REPLAY_KEY_VERSION = "v1"
SPS_IDENTITY_PROTOCOL_VERSION = "2"
SPS_IDENTITY_ROLLBACK_FLOOR = "bridge-v2"
SPS_IDENTITY_ROLLOUT_PHASE = "bridge"
